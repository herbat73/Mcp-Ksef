name: Build and Push Docker Image

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v5
      
      # Get the short commit hash
      - name: Get short commit hash
        id: vars
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      
      # Log in to GitHub Docker Registry
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      # Build the Docker image
      - name: Build Docker image
        run: |
          IMAGE_TAG=$([[ "$" == "push" && "$" =~ ^refs/tags/ ]] && echo "$" || echo "$")
          docker build -build-arg PAT_TOKEN=${{ secrets.GITHUB_TOKEN }} . --file Dockerfile --tag ghcr.io/herbat73/mcp-ksef:${IMAGE_TAG}
          docker tag ghcr.io/herbat73/mcp-ksef:${IMAGE_TAG} ghcr.io/herbat73/mcp-ksef:latest
      
      # Push the Docker image to GitHub Container Registry
      - name: Push Docker image
        run: |
          IMAGE_TAG=$([[ "$" == "push" && "$" =~ ^refs/tags/ ]] && echo "$" || echo "$")
          docker push ghcr.io/herbat73/mcp-ksef:${IMAGE_TAG}
          docker push ghcr.io/herbat73/mcp-ksef:latest