services:
  mcpksef:
    image: mcpksef.hybridapp
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PAT_TOKEN: TUTAJ_PAT_TOKEN
    container_name: mcp-ksef-container
    ports:
      - 8080:8080
    environment:
      - KSEF_TOKEN="test my ksef token"
      - KSEF_VATID="my vat id"